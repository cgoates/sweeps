name: build-and-run-tests-ubuntu
run-name: Build and run tests
on: [push]
jobs:
  do-it:
    runs-on: ubuntu-22.04
    container: gcc:13
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install OpenMP
        run: apt-get update && apt-get install -y libomp-dev
      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28.x'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy
      - name: Setup Mold
        uses: rui314/setup-mold@v1
        with:
          mold-version: 2.34.1
          make-default: true
      - name: Use cmake
        run: |
          mkdir build
          cd build
          echo "CXX=g++-10" >> $GITHUB_ENV
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j10
      - name: Install Fortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran-12
          sudo update-alternatives --install /usr/bin/gfortran gfortran /usr/bin/gfortran-12 100
      - name: Build ScaleUntrim
        run : |
          uname -a
          python3 scripts/scaleUntrimBuilder.py
      - name: Run tests
        run: |
          cd build
          ctest -j10 --rerun-failed --output-on-failure
